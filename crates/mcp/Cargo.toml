[package]
name = "coffer-mcp"
description = "Coffer's MCP stdio server over the core API"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
coffer-core.workspace = true
coffer-import.workspace = true
rmcp.workspace = true
tokio.workspace = true
schemars.workspace = true
serde.workspace = true
# Tool arguments arrive and results leave as JSON objects (rmcp's own type);
# already in the tree via rmcp.
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# The in-process MCP client the tests call tools through (tests/support).
# Adds tokio-stream (MIT) to the tree, for tests only.
rmcp = { workspace = true, features = ["client"] }
# The fixture database lives in a scratch directory.
tempfile.workspace = true
# tests/support reuses crates/import/tests/common, which reads with rusqlite.
rusqlite.workspace = true
# Dates for the manual row the fixture database seeds.
chrono.workspace = true
