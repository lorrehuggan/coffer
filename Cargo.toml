[workspace]
# Dependency direction: app and mcp depend on core and import; import depends
# on core. core never depends on GPUI, MCP, or any network/AI crate.
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Every external version lives here; crates opt in with `<crate>.workspace = true`.
[workspace.dependencies]
coffer-core = { path = "crates/core" }
coffer-import = { path = "crates/import" }
coffer-mcp = { path = "crates/mcp" }

# GUI (crates/app only)
gpui-kit = "0.9.0"

# Storage. Pinned to 0.40: refinery and the rest of the ecosystem don't accept
# rusqlite 0.41 / libsqlite3-sys 0.39 yet. Switch `bundled` to
# `bundled-sqlcipher-vendored-openssl` if the DB is encrypted later.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# Checksums applied migrations and refuses to run if a shipped one was edited.
refinery = { version = "0.10.0", default-features = false, features = ["rusqlite"] }

# Import
csv = "1.4"
serde = { version = "1", features = ["derive"] }
encoding_rs = "0.8.44"
# Young single-maintainer crate: pinned exactly, used only behind the Importer trait.
ofx-kit = "=0.3.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
toml = "1.2"

# Errors, CLI, logging, paths, IDs
thiserror = "2"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
directories = "6"
uuid = { version = "1.29", features = ["v7"] }

# Rules engine
regex = "1.13"
aho-corasick = "1.1"

# MCP server (`coffer mcp` only; core stays synchronous)
rmcp = { version = "3.9", features = ["transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "io-std"] }
schemars = "1"


# Test and example tooling (crates/app dev-dependencies). Each is already in
# the tree via GPUI; the reasons are recorded where they're used.
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ttf-parser = "0.25"
